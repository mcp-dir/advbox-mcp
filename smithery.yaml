# Smithery configuration for AdvBox
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_advbox

name: advbox-mcp
displayName: "AdvBox"
description: >
  Wrapper da API oficial do AdvBox (software jurídico): processos (e histórico, movimentações, publicações), clientes/contatos, tarefas/anotações e financeiro (transações). Leitura + criação e atualização de processos e transações. Autenticação por token de API do escritório.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/advbox-mcp
repository: https://github.com/mcp-dir/advbox-mcp

tags:
  - advbox
  - brazil
  - med
  - vertical
  - read-write

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_advbox

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_advbox/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
